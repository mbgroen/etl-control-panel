# =============================================================================
# FastDL — HTTP download server for ET: Legacy map packages
#
# Serves the game server's own etmain directory read-only. There is no mirror
# and no sync step: what the server has installed is exactly what clients can
# download, which removes the most common cause of "client downloads a pk3 and
# still gets kicked for a checksum mismatch".
#
# The engine requests <sv_wwwBaseURL>/<gamedir>/<file>.pk3, so a client looking
# for a map on this server fetches /etmain/<map>.pk3 from here.
# =============================================================================

server {
    listen       80;
    server_name  _;

    # This container is reachable by anyone who can reach the published port.
    # Do not advertise the exact nginx build to them.
    server_tokens off;

    root /srv/fastdl;

    access_log /var/log/nginx/fastdl.access.log;
    error_log  /var/log/nginx/fastdl.error.log warn;

    # pk3 files are large and already compressed (they are zip archives), so
    # gzip would burn CPU for nothing.
    gzip off;

    # sendfile + a large output buffer keeps transfer overhead low on a NAS.
    sendfile       on;
    tcp_nopush     on;
    output_buffers 2 512k;

    # ---------------------------------------------------------------- map data
    # Only .pk3 files are exposed. Everything else in etmain — server configs,
    # logs, ban lists, and anything else an operator has dropped in there — must
    # never be downloadable, which is why this allowlists by extension instead
    # of denying known-sensitive names.
    location ~* ^/(etmain|legacy)/[A-Za-z0-9._-]+\.pk3$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff";
        types { }
        default_type application/octet-stream;

        # Directory listings would enumerate the whole library; clients only
        # ever request files by exact name.
        autoindex off;
        try_files $uri =404;
    }

    # A tiny endpoint the control panel and any uptime monitor can poll.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Anything not matched above is refused outright rather than 404ing, so a
    # misconfigured base URL fails loudly and obviously.
    location / {
        return 403;
    }
}

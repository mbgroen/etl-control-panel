# =============================================================================
# ET: Legacy server + control panel + FastDL — for OpenMediaVault
#
# Paste into Services → Compose → Files → Add, then Up. Every host path uses
# CHANGE_TO_COMPOSE_DATA_PATH, which OMV replaces with the Data shared folder
# configured for the stack, so nothing here needs editing by hand.
#
# Generated from deploy/docker-compose.yml with the variables collapsed to
# their defaults: OMV has no .env file, so anything left as ${...} would
# resolve to nothing.
#
# Directories under the Data shared folder:
#
#   etl-server/etmain      server config and .pk3 map files
#   etl-server/legacy      the mod package the control panel publishes for FastDL
#   etl-server/homepath    XP database, game and attack logs — see below
#   etl-control-panel/     admin accounts, config backups, player history
#
# ONE STEP BY HAND, before the first Up. The game server runs as uid 1000 and a
# bind mount keeps the shared folder's ownership, so Docker would create this
# directory as root and the server could not write its XP database or logs —
# silently, which is the worst way to lose a week of everyone's XP:
#
#   mkdir -p <Data shared folder>/etl-server/homepath
#   chown -R 1000:1000 <Data shared folder>/etl-server/homepath
#
# Diagnostics in the control panel checks precisely this and names the fix.
#
# etl-control-panel/ is deliberately a SIBLING of etl-server/, not inside it.
# The game data tree is mounted into the FastDL container, which is the one
# service you may publish to the internet; the credential store staying outside
# that tree means it is not there to be served, whatever nginx is told later.
#
# Ports — open in the OMV firewall if you use one. Forward 27960/udp and, only
# if players come from the internet, 8081/tcp on your router. The game port is
# not published by Docker at all: the game server is on the host network, so it
# binds 27960 on the NAS itself (see the note on that service).
#
#   27960/udp  game server
#   8085/tcp   control panel
#   8081/tcp   FastDL (map downloads)
# =============================================================================

name: etl

services:
  # ---------------------------------------------------------------------------
  # The game server.
  # ---------------------------------------------------------------------------
  etl-server:
    container_name: etl-server
    image: etlegacy/server:latest
    volumes:
      # Only etmain is bind-mounted. The image ships nothing here but config
      # templates, so the mount is what gives the server its map library.
      - CHANGE_TO_COMPOSE_DATA_PATH/etl-server/etmain:/legacy/server/etmain
      #
      # Everything the server writes that is not the config: the XP database
      # (etl.db), the game and attack logs, and the cvars it archives itself.
      # Without this they sit in the container's writable layer and vanish on
      # the next "docker compose pull" — XP saving that survives a week of play
      # but not an image update is worse than none.
      #
      # The game server runs as uid 1000, and a bind-mounted directory keeps
      # the host's ownership, so create it before first start:
      #   mkdir -p "$COMPOSE_DATA_PATH/etl-server/homepath"
      #   chown -R 1000:1000 "$COMPOSE_DATA_PATH/etl-server/homepath"
      # Diagnostics checks this and says so if it is wrong.
      - CHANGE_TO_COMPOSE_DATA_PATH/etl-server/homepath:/legacy/homepath
      #
      # Do NOT mount /legacy/server/legacy. The image bakes the whole Legacy
      # mod in there — qagame.mp.x86_64.so (the game module the engine dlopens),
      # legacy_v<version>.pk3, and the Lua and omni-bot trees — and a bind mount
      # of an empty host directory hides all of it. Docker seeds a mount from
      # the image only for *named volumes*, never for bind mounts, so the mod
      # silently disappears and the server dies on startup with "VM_Create on
      # game failed". The image itself says as much: it declares etmain as a
      # volume and legacy as not — the mod is image-managed and upgrades with
      # the image.
    # The game server runs on the HOST network, not a bridge, and this is not
    # a preference — it is what makes the server joinable.
    #
    # The heartbeat a server sends to the master carries no port number; look
    # at sv_main.c and all it writes is "heartbeat <msg>". The master takes the
    # address *and the port* from where the packet appears to come from. On a
    # bridge with a published port that is a lie: inbound DNAT delivers to
    # 27960 correctly, but outbound the packet is masqueraded, and because
    # docker-proxy already holds host UDP 27960 the masquerade cannot reuse it
    # and picks a random high port instead. The master then advertises your
    # server on a port nothing answers on. It is listed, it looks healthy, and
    # every player who clicks Join gets a connection error.
    #
    # On the host network the engine binds 27960 itself, so the heartbeat
    # leaves from 27960 and the master learns the truth.
    #
    # Consequences worth knowing: there is no "ports:" mapping any more — the
    # port comes from net_port in the server config — and the container shares
    # the host's interfaces, so nothing else may already be on 27960/udp. On
    # Docker Desktop (macOS, Windows) host networking behaves differently; for
    # a LAN-only test server there, swap this for:
    #     ports: ["27960:27960/udp"]
    #     networks: [etl]
    # and accept that the public listing will carry the wrong port.
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        # Without a cap a chatty server will fill the disk over months.
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Control panel — web UI and API.
  # ---------------------------------------------------------------------------
  control-panel:
    container_name: etl-control-panel
    # Tracks the latest release. Pin to a version tag (e.g. :1.1.0) if you would
    # rather decide when to move; upgrade either way with
    # "docker compose pull && docker compose up -d".
    image: mbgroen/etl-control-panel:latest
    ports:
      # Published on 8085 by default: 8080 is one of the most contended ports
      # on a home server — NAS UIs, UniFi controllers and countless other
      # services claim it. The container still listens on 8080 inside; only the
      # host side moves, so nothing internal has to change.
      - "8085:8080"
    volumes:
      # Read-write: the control panel edits the server config and installs maps.
      - CHANGE_TO_COMPOSE_DATA_PATH/etl-server:/data/etl-server
      # Control panel state: admin account, config backups, activity history.
      #
      # Deliberately a sibling of etl-server/ rather than a directory inside it.
      # The game data tree is bind-mounted into the FastDL container, which is
      # usually the one service published to the internet, so keeping the
      # credential store outside that tree means no nginx rule stands between
      # this file and the public — it is simply not there to be served.
      - CHANGE_TO_COMPOSE_DATA_PATH/etl-control-panel:/data/control-panel
      # Container start/stop/restart and log streaming.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Set this to the same value as "rconpassword" in your server config to
      # unlock the console and player kick/ban. Everything else works without it.
      # Every value below can be set in a .env file beside this one — see
      # .env.example, which documents them. They are interpolated rather than
      # hard-coded so that file is telling the truth: a variable it describes
      # and this file ignores is worse than no documentation at all.
      RCON_PASSWORD: ""

      # Optional: pre-fills the FastDL address. You can also just type it in the
      # control panel later. Use the NAS's LAN IP — not localhost.
      FASTDL_BASE_URL: ""

      # Leave empty and the control panel runs its first-run setup wizard.
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD_HASH: ""
      SESSION_SECRET: ""
      SESSION_TTL_HOURS: "12"
      # Set to true only when the panel is served over HTTPS.
      COOKIE_SECURE: "false"

      POLL_INTERVAL_SEC: "10"
      MAX_UPLOAD_MB: "256"
      GEO_LOOKUP: "true"
      LOG_LEVEL: "info"

      ETL_HOST: host.docker.internal
      ETL_PORT: 27960
      ETL_CONTAINER: etl-server
      FASTDL_CONTAINER: etl-fastdl
      ETMAIN_PATH: /data/etl-server/etmain
      LEGACY_PATH: /data/etl-server/legacy
      SERVER_HOME_PATH: /data/etl-server/homepath
      STATE_PATH: /data/control-panel
      SERVER_CONFIG_NAME: "etl_server.cfg"

    # Runs as root so it can use the Docker socket and write to the game data
    # directory whatever their ownership — which is what removes the PUID/PGID
    # and docker-group lookups from installation. The socket is already
    # root-equivalent, so this grants little beyond what the mount does; see the
    # README for the hardened, unprivileged alternative.
    user: "0:0"

    # host.docker.internal has to be taught to a bridge container on Linux, and
    # this is the only way it reaches the game server now that the game server
    # lives on the host network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - etl-server
    networks:
      - etl
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FastDL — HTTP map downloads.
  #
  # Always created so the control panel can start and stop it on demand. Its
  # restart policy honours a manual stop, so switching it off in the control panel
  # survives a reboot.
  # ---------------------------------------------------------------------------
  fastdl:
    container_name: etl-fastdl
    # Kept on the same channel as the control panel; see the note on its image line.
    image: mbgroen/etl-fastdl:latest
    ports:
      # Only the host side moves; nginx listens on 80 inside either way. Whatever
      # you choose has to appear in the FastDL base URL players are given.
      - "8081:80"
    volumes:
      # Read-only, and only the two directories nginx actually serves — not the
      # whole data tree. etl-control-panel/ lives alongside these and holds the
      # admin credential store and config backups, which have no business being
      # inside a container published to the internet. nginx would refuse to
      # serve them anyway (it allowlists .pk3 under these two paths), but a
      # mount is a stronger boundary than a location block: what is not mounted
      # cannot be served by a later misconfiguration.
      - CHANGE_TO_COMPOSE_DATA_PATH/etl-server/etmain:/srv/fastdl/etmain:ro
      - CHANGE_TO_COMPOSE_DATA_PATH/etl-server/legacy:/srv/fastdl/legacy:ro
    networks:
      - etl
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  etl:
    driver: bridge

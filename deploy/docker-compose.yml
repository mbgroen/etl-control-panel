# =============================================================================
# ET: Legacy server + dashboard + FastDL — prebuilt images
#
# Runs the whole stack from published images, so this file is all you need on
# the host: no source checkout, no build step. The dashboard asks you to create
# an admin account the first time you open it.
#
#   docker compose up -d
#
# All three services keep their data under one directory, set by
# COMPOSE_DATA_PATH and defaulting to ./data next to this file:
#
#   COMPOSE_DATA_PATH=/srv/appdata docker compose up -d
#
# or put COMPOSE_DATA_PATH=/srv/appdata in a .env file beside this one. Any
# absolute path works. If your host's Docker UI substitutes its own data
# directory into compose files, replace the variable with that token instead —
# the layout underneath it is what matters, not how the path gets there.
#
# Ports:
#   27960/udp  game server
#   8080/tcp   dashboard
#   8081/tcp   FastDL (map downloads)
# =============================================================================

name: etlegacy

services:
  # ---------------------------------------------------------------------------
  # The game server.
  # ---------------------------------------------------------------------------
  etlegacy:
    container_name: etlegacy-server
    image: etlegacy/server:latest
    volumes:
      # Only etmain is bind-mounted. The image ships nothing here but config
      # templates, so the mount is what gives the server its map library.
      - ${COMPOSE_DATA_PATH:-./data}/etlegacy/etmain:/legacy/server/etmain
      #
      # Do NOT mount /legacy/server/legacy. The image bakes the whole Legacy
      # mod in there — qagame.mp.x86_64.so (the game module the engine dlopens),
      # legacy_v<version>.pk3, and the Lua and omni-bot trees — and a bind mount
      # of an empty host directory hides all of it. Docker seeds a mount from
      # the image only for *named volumes*, never for bind mounts, so the mod
      # silently disappears and the server dies on startup with "VM_Create on
      # game failed". The image itself says as much: it declares etmain as a
      # volume and legacy as not — the mod is image-managed and upgrades with
      # the image.
    ports:
      - "27960:27960/udp"
    networks:
      - etlegacy
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        # Without a cap a chatty server will fill the disk over months.
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Dashboard — web UI and API.
  # ---------------------------------------------------------------------------
  dashboard:
    container_name: etlegacy-dashboard
    # Pinned rather than :latest. These tags are published by hand while a
    # GitHub Actions outage keeps CI from building them, so :latest does not
    # currently track this file. Move both images back to :latest once CI is
    # publishing again; upgrade with "docker compose pull && docker compose up -d".
    image: mbgroen/etlegacy-dashboard:1.0.2
    ports:
      - "8080:8080"
    volumes:
      # Read-write: the dashboard edits the server config and installs maps.
      - ${COMPOSE_DATA_PATH:-./data}/etlegacy:/data/etlegacy
      # Dashboard state: admin account, config backups, activity history.
      - ${COMPOSE_DATA_PATH:-./data}/dashboard:/data/dashboard
      # Container start/stop/restart and log streaming.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Set this to the same value as "rconpassword" in your server config to
      # unlock the console and player kick/ban. Everything else works without it.
      RCON_PASSWORD: ""

      # Optional: pre-fills the FastDL address. You can also just type it in the
      # dashboard later. Use the NAS's LAN IP — not localhost.
      FASTDL_BASE_URL: ""

      ETL_HOST: etlegacy
      ETL_PORT: 27960
      ETL_CONTAINER: etlegacy-server
      FASTDL_CONTAINER: etlegacy-fastdl
      ETMAIN_PATH: /data/etlegacy/etmain
      LEGACY_PATH: /data/etlegacy/legacy
      STATE_PATH: /data/dashboard
      SERVER_CONFIG_NAME: etl_server.cfg

    # Runs as root so it can use the Docker socket and write to the game data
    # directory whatever their ownership — which is what removes the PUID/PGID
    # and docker-group lookups from installation. The socket is already
    # root-equivalent, so this grants little beyond what the mount does; see the
    # README for the hardened, unprivileged alternative.
    user: "0:0"

    depends_on:
      - etlegacy
    networks:
      - etlegacy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FastDL — HTTP map downloads.
  #
  # Always created so the dashboard can start and stop it on demand. Its
  # restart policy honours a manual stop, so switching it off in the dashboard
  # survives a reboot.
  # ---------------------------------------------------------------------------
  fastdl:
    container_name: etlegacy-fastdl
    # Pinned to match the dashboard; see the note on its image line.
    image: mbgroen/etlegacy-fastdl:1.0.2
    ports:
      - "8081:80"
    volumes:
      # Read-only: this container serves files, it never changes them.
      - ${COMPOSE_DATA_PATH:-./data}/etlegacy:/srv/fastdl:ro
    networks:
      - etlegacy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  etlegacy:
    driver: bridge

# =============================================================================
# Keeps each image's Docker Hub page in step with this repository.
#
# Docker Hub's overview is the landing page for anyone who finds an image
# without the repository, so the text lives in version control rather than in a
# web form where it would quietly drift out of date.
#
# Separate from the image build on purpose: rewriting a description is instant
# and has nothing to do with producing an image, so it should not sit behind a
# multi-minute build — and the build workflow ignores docs/ and *.md changes, so
# editing these files would never trigger it anyway.
#
# MANUAL ONLY, and disabled unless a DOCKERHUB_PASSWORD secret exists.
#
# Docker Hub's description endpoint is not part of the registry API: a personal
# access token authenticates fine (which is why image pushes work) and is then
# refused with 403 on the metadata PATCH. Editing a description requires account
# credentials, so this cannot run on the same token the build uses.
#
# That leaves two options, and neither should happen by accident:
#
#   1. Paste docs/dockerhub-*.md into the Docker Hub web UI by hand. No
#      credentials anywhere, and it takes a minute per image.
#   2. Add a DOCKERHUB_PASSWORD secret and run this workflow. Weigh it up
#      first: an account password in CI is broader access than the scoped token
#      beside it, and it cannot be limited to one repository.
#
# Left on workflow_dispatch rather than a push trigger so it does not fail on
# every documentation change for anyone who has not made that choice.
# =============================================================================

name: Docker Hub description

on:
  workflow_dispatch:

env:
  DASHBOARD_IMAGE: etlegacy-dashboard
  FASTDL_IMAGE: etlegacy-fastdl

jobs:
  describe:
    name: Push overviews to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skipped rather than failed when the password secret is absent, so running
    # this by mistake is a no-op instead of a red cross.
    if: ${{ secrets.DOCKERHUB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Dashboard
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DASHBOARD_IMAGE }}
          short-description: 'Web control panel for a Wolfenstein: Enemy Territory (ET: Legacy) game server'
          readme-filepath: ./docs/dockerhub-dashboard.md

      - name: FastDL
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FASTDL_IMAGE }}
          short-description: 'nginx HTTP download server (FastDL) for ET: Legacy map packages'
          readme-filepath: ./docs/dockerhub-fastdl.md

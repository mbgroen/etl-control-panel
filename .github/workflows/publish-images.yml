# =============================================================================
# Builds both container images and publishes them to Docker Hub.
#
# Runs on GitHub's machines, so no local Docker is needed — and the image is
# built for the target platform regardless of the architecture you develop on.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     an access token from hub.docker.com → Account settings
#                       → Personal access tokens (scope: Read & Write)
# =============================================================================

name: Publish images

# Releases only. Both a branch push and a tag push used to match, so every
# release built the same commit twice — two runs, two identical images, and a
# tag list that made it look like something differed. Publishing on tags alone
# means one build per release and one image per version.
#
# A push to main no longer publishes anything, which is the point: an image now
# corresponds to a version someone chose to release, not to whatever happened
# to land on the branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms to build'
        required: false
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
          - linux/arm64

env:
  DASHBOARD_IMAGE: etlegacy-dashboard
  FASTDL_IMAGE: etlegacy-fastdl

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install and verify server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Install and build web
        working-directory: web
        run: |
          npm ci
          npm run build

  publish:
    name: Build and push
    runs-on: ubuntu-latest
    # Never publish an image that failed its own checks.
    needs: verify
    # Fail fast rather than sitting in a queue for three quarters of an hour.
    timeout-minutes: 45
    env:
      # amd64 only by default: that is what nearly every NAS and server runs,
      # and arm64 would have to be emulated through QEMU on GitHub's runners —
      # roughly triple the build time for an artefact most people would not use.
      # Pick a different set per run from the "Run workflow" menu, or change the
      # fallback below if your server is ARM (check with `uname -m` on it).
      #
      # The literal is repeated rather than read from a workflow-level env var
      # because the env context is not available inside a job's own env block.
      PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the step below can tell whether this release is the
          # newest one.
          fetch-depth: 0

      # Whether :latest should move.
      #
      # Publishing an older version's tag — a backport, or a rebuild of
      # something historical — must not pull :latest backwards onto it. That
      # has happened here once already, silently. So :latest follows only the
      # highest version in the repository; a manual run is taken as a
      # deliberate publish and moves it too.
      - name: Decide whether this is the newest release
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ "${GITHUB_REF_NAME}" = "$newest" ]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'latest=false' >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is not the newest release ($newest), so :latest is left alone."
          fi

      # Only needed to emulate a foreign architecture. Skipped for a native
      # amd64-only build, where it would just add a step for nothing.
      - name: Set up QEMU
        if: contains(env.PLATFORMS, 'arm')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags for the dashboard image
        id: dashboard-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DASHBOARD_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
            # Full version only. A floating x.y tag looks like a pin but moves
            # under you on the next patch, which is the worst of both: neither
            # reproducible nor current. :latest is the moving target, and a
            # three-part version is the one that never changes meaning.
            type=semver,pattern={{version}}
            # No per-commit tag: it added one registry tag per push for
            # something nobody browses. The commit is still recorded in the
            # image itself, as the org.opencontainers.image.revision label that
            # metadata-action emits, so any image can still be traced back:
            #   docker inspect <image> --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'

      - name: Build and push the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.dashboard-meta.outputs.tags }}
          labels: ${{ steps.dashboard-meta.outputs.labels }}
          # Layer cache in the Actions cache keeps rebuilds to a couple of minutes.
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      - name: Derive tags for the FastDL image
        id: fastdl-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FASTDL_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
            # Full version only. A floating x.y tag looks like a pin but moves
            # under you on the next patch, which is the worst of both: neither
            # reproducible nor current. :latest is the moving target, and a
            # three-part version is the one that never changes meaning.
            type=semver,pattern={{version}}
            # No per-commit tag: it added one registry tag per push for
            # something nobody browses. The commit is still recorded in the
            # image itself, as the org.opencontainers.image.revision label that
            # metadata-action emits, so any image can still be traced back:
            #   docker inspect <image> --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'

      - name: Build and push the FastDL image
        uses: docker/build-push-action@v6
        with:
          context: ./fastdl
          file: ./fastdl/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.fastdl-meta.outputs.tags }}
          labels: ${{ steps.fastdl-meta.outputs.labels }}
          cache-from: type=gha,scope=fastdl
          cache-to: type=gha,scope=fastdl,mode=max

      - name: Summarise
        run: |
          {
            echo "### Images published"
            echo
            echo '```'
            echo "${{ steps.dashboard-meta.outputs.tags }}"
            echo "${{ steps.fastdl-meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

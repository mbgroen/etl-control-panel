# =============================================================================
# ET: Legacy server + management control panel + FastDL
#
# Builds the control panel from this checkout. For a no-build install from
# published images, use deploy/docker-compose.yml instead.
#
# Copy .env.example to .env and fill it in before starting.
#
#   docker compose up -d
#
# Ports published:
#   27960/udp  game server
#   8085/tcp   control panel  (change with CONTROL_PANEL_PORT)
#   8081/tcp   FastDL     (change with FASTDL_PORT)
# =============================================================================

name: etl

services:
  # ---------------------------------------------------------------------------
  # The game server itself.
  # ---------------------------------------------------------------------------
  etl-server:
    container_name: etl-server
    image: etlegacy/server:latest
    volumes:
      # Only etmain is bind-mounted. The image ships nothing here but config
      # templates, so the mount is what gives the server its map library.
      - ${COMPOSE_DATA_PATH}/etl-server/etmain:/legacy/server/etmain
      #
      # Do NOT mount /legacy/server/legacy. The image bakes the whole Legacy
      # mod in there — qagame.mp.x86_64.so (the game module the engine dlopens),
      # legacy_v<version>.pk3, and the Lua and omni-bot trees — and a bind mount
      # of an empty host directory hides all of it. Docker seeds a mount from
      # the image only for *named volumes*, never for bind mounts, so the mod
      # silently disappears and the server dies on startup with "VM_Create on
      # game failed". The image itself says as much: it declares etmain as a
      # volume and legacy as not — the mod is image-managed and upgrades with
      # the image.
    ports:
      - "${GAME_PORT:-27960}:27960/udp"
    networks:
      - etl
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        # Without a cap, a chatty server fills the NAS disk over months.
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Control panel: REST API, WebSocket, and the web UI.
  # ---------------------------------------------------------------------------
  control-panel:
    container_name: etl-control-panel
    build:
      context: .
      dockerfile: Dockerfile
    # Prefer a published image once you have one:
    # image: ghcr.io/mbgroen/etl-control-panel:latest
    ports:
      - "${CONTROL_PANEL_PORT:-8085}:8080"
    volumes:
      # Read-write: the control panel edits the server config and installs pk3s.
      - ${COMPOSE_DATA_PATH}/etl-server:/data/etl-server
      # Control-panel-owned state: config backups and the activity history.
      # A sibling of etl-server/, not a directory inside it: the game data tree is
      # mounted into the internet-facing FastDL container, and the credential
      # store has no business being anywhere near it.
      - ${COMPOSE_DATA_PATH}/etl-control-panel:/data/control-panel
      # Container lifecycle control. See the security note in the README —
      # swap this for a socket proxy if the control panel is exposed beyond a LAN.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Optional. Leave empty and the control panel runs a first-run setup wizard in
      # the browser, storing the account in the state directory. Set them to
      # manage credentials declaratively instead; they then take precedence.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      ETL_CONTAINER: etl-server
      FASTDL_CONTAINER: etl-fastdl
      # Service name on the shared network — not localhost, and not the host IP.
      ETL_HOST: etl-server
      ETL_PORT: 27960
      RCON_PASSWORD: ${RCON_PASSWORD}

      # Must resolve to the same host directory the game server mounts, or the
      # control panel will edit a config the server never reads.
      ETMAIN_PATH: /data/etl-server/etmain
      LEGACY_PATH: /data/etl-server/legacy
      STATE_PATH: /data/control-panel
      SERVER_CONFIG_NAME: ${SERVER_CONFIG_NAME:-etl_server.cfg}

      FASTDL_BASE_URL: ${FASTDL_BASE_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-256}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-10}
    # Runs unprivileged. PUID/PGID must be able to write the etmain bind mount.
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      # The host's docker group, so the socket is usable without running as root.
      # Find it with: getent group docker | cut -d: -f3
      - "${DOCKER_GID:-999}"
    depends_on:
      - etl-server
    networks:
      - etl
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FastDL: HTTP downloads for custom maps.
  #
  # Always defined so the control panel can start and stop it on demand. Its
  # "unless-stopped" policy means a stop from the control panel survives a reboot.
  # ---------------------------------------------------------------------------
  fastdl:
    container_name: etl-fastdl
    image: nginx:1.27-alpine
    ports:
      - "${FASTDL_PORT:-8081}:80"
    volumes:
      # Read-only, and only the two directories nginx actually serves — not the
      # whole data tree. control panel/ sits alongside these and holds the admin
      # credential store and config backups, which have no business being inside
      # a container published to the internet. nginx would refuse to serve them
      # anyway (it allowlists .pk3 under these two paths), but a mount is a
      # stronger boundary than a location block.
      - ${COMPOSE_DATA_PATH}/etl-server/etmain:/srv/fastdl/etmain:ro
      - ${COMPOSE_DATA_PATH}/etl-server/legacy:/srv/fastdl/legacy:ro
      - ./fastdl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - etl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  etl:
    driver: bridge
